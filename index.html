<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Orbit</title>
  <meta name="description" content="A personal meditation space for calm, confidence, health, wealth, love and freedom.">
  <meta name="theme-color" content="#07061a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Orbit">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="stars" aria-hidden="true"></canvas>
  <div class="nebula n1" aria-hidden="true"></div>
  <div class="nebula n2" aria-hidden="true"></div>
  <div class="nebula n3" aria-hidden="true"></div>

  <main id="home" class="screen active">
    <div class="home-inner">
      <header class="brand">
        <p class="greeting" id="greeting">Welcome</p>
        <h1>Orbit</h1>
      </header>

      <div class="length">
        <span class="label" id="lenLabel">Minutes</span>
        <div class="seg" role="radiogroup" aria-labelledby="lenLabel">
          <button role="radio" data-min="3">3</button>
          <button role="radio" data-min="5">5</button>
          <button role="radio" data-min="10">10</button>
          <button role="radio" data-min="20">20</button>
        </div>
      </div>

      <button class="daily" data-theme="daily">
        <span class="daily-orb" aria-hidden="true"></span>
        <span class="daily-txt">
          <span class="title">Daily Orbit</span>
          <span class="sub">Calm, confidence, health, wealth, love &amp; freedom in one journey</span>
        </span>
      </button>

      <h2 class="section">Journeys</h2>
      <div class="grid" id="grid"></div>

      <p class="foot">Headphones recommended · works offline</p>
    </div>
  </main>

  <section id="session" class="screen" aria-label="Meditation session">
    <div class="stage">
      <div class="orb" id="orb"><div class="orb-core"></div></div>
    </div>
    <p class="cue" id="cue" aria-hidden="true"></p>
    <p class="line" id="line" aria-live="polite"></p>

    <div class="controls">
      <div class="bar top">
        <span class="remaining" id="remaining"></span>
        <button class="icon" id="endBtn" aria-label="End session">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="bar bottom">
        <button class="icon" id="muteBtn" aria-label="Mute"></button>
        <input type="range" id="vol" min="0" max="1" step="0.01" aria-label="Volume">
        <button class="icon big" id="pauseBtn" aria-label="Pause"></button>
      </div>
    </div>
  </section>

  <section id="end" class="screen" aria-label="Session complete">
    <div class="end-orb" aria-hidden="true"></div>
    <h2>Welcome back</h2>
    <p id="endLine">Carry this feeling with you.</p>
    <button class="pill" id="homeBtn">Return home</button>
  </section>

  <script src="content.js"></script>
  <script src="audio.js"></script>
  <script src="app.js"></script>
</body>
</html>
